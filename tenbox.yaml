project: tenbox
setup: bun install

checks:
  fast:
    types: bunx tsgo --noEmit
    unit: bun test domain server rules cli/application cli/infra cli/test
    format: bunx biome format cli domain server rules
    lint: bunx biome check --formatter-enabled=false cli domain server rules
    unused: bunx knip
  full:
    e2e: bun test cli/commands

tracker: { kind: github }
