<style>
/* Layout: a character-select screen. Big animated sprites on tiled floor cards, one control bar, a cast builder at the bottom. Single dark look by choice. */
:root {
  color-scheme: dark;
  --bg: #0e1016;
  --panel: #181c28;
  --panel-2: #20263a;
  --line: #2b3350;
  --tile-a: #1b2030;
  --tile-b: #1f2537;
  --fg: #e7e9f1;
  --muted: #8f97ad;
  --accent: #6fb6ff;
  --human: #f4b547;
  --ok: #5fd08f;
  --wood: #7a5236;
  --wood-hi: #9c6c48;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.45; padding-inline: 16px; padding-block: 24px 56px; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin-inline: auto; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 5vw, 44px); margin: 0; letter-spacing: .5px; text-wrap: balance; }
.lede { color: var(--muted); margin: 6px 0 20px; max-width: 64ch; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); padding-block: 10px; border-bottom: 1px solid var(--line); margin-bottom: 18px; display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); border-color: var(--accent); color: var(--fg); }
.seg button.hum[aria-pressed="true"] { border-color: var(--human); color: var(--human); }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.now { font-family: var(--font-mono); font-size: 12px; color: var(--fg); min-width: 150px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card.picked { border-color: var(--human); box-shadow: 0 0 0 1px var(--human), 0 0 26px -10px var(--human); }
.stage { position: relative; display: grid; place-items: center; padding: 18px 10px 8px; background-color: var(--tile-a); background-image: linear-gradient(45deg, var(--tile-b) 25%, transparent 25%, transparent 75%, var(--tile-b) 75%), linear-gradient(45deg, var(--tile-b) 25%, transparent 25%, transparent 75%, var(--tile-b) 75%); background-size: 24px 24px; background-position: 0 0, 12px 12px; }
canvas { image-rendering: pixelated; display: block; }
.num { position: absolute; top: 8px; left: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.roles { display: flex; gap: 10px; justify-content: center; padding: 6px 0 2px; }
.roles figure { margin: 0; display: grid; justify-items: center; gap: 0; }
.roles figcaption { font-size: 10px; color: var(--muted); font-family: var(--font-mono); }
.info { padding: 12px 14px 14px; display: grid; gap: 6px; flex: 1; }
.name { font-family: var(--font-display); font-size: 20px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.name small { font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--muted); }
.desc { color: var(--muted); font-size: 13px; margin: 0; }
.tic { font-size: 12px; font-family: var(--font-mono); color: var(--accent); }
.info .row { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--human); color: var(--bg); border-color: var(--human); font-weight: 600; }
.cast { margin-top: 30px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cast h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.cast-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); }
.slot { background: var(--panel); padding: 12px; display: grid; justify-items: center; gap: 8px; }
.slot .stage { width: 100%; border-radius: 6px; padding-top: 10px; }
.slot select { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.slot b { font-family: var(--font-display); font-weight: 500; }
.say { padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); }
.say code { font-family: var(--font-mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
.hint { color: var(--muted); font-size: 12px; }
@media (max-width: 760px) { .cast-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>

<main class="wrap">
  <h1>Tenbox Crew</h1>
  <p class="lede">Pick the characters for your agents. Every sprite is animated in every Tenbox state. Each one takes the role color: gold master, blue worker, purple reviewer, teal subagent. Mix them in the cast at the bottom.</p>

  <div class="bar">
    <span class="lbl">State</span>
    <div class="seg" id="states"></div>
    <label class="toggle"><input type="checkbox" id="desk" checked> desk</label>
    <span class="now" id="now"></span>
  </div>

  <section class="grid" id="grid" aria-label="Characters"></section>

  <section class="cast" aria-labelledby="castH">
    <h2 id="castH">Your cast</h2>
    <div class="cast-row" id="cast"></div>
    <div class="say"><code id="sayTxt"></code><button class="btn" type="button" id="copy">Copy</button><span class="hint" id="copyHint">Paste this to Claude and the mockup gets your crew.</span></div>
  </section>
</main>

  const W = 20, H = 22, OX = 2, OY = 4;
  const ICONS = {
    "!": [".KK.", ".GG.", ".GG.", ".GG.", "....", ".GG."],
    "?": ["GGG.", "...G", ".GG.", ".G..", "....", ".G.."],
    "z": ["GGGG", "..G.", ".G..", "GGGG"],
    "v": ["...G", "..G.", "G.G.", ".G.."],
  };
  function px(c, s, x, y, col, w = 1, h = 1) { c.fillStyle = col; c.fillRect(x * s, y * s, w * s, h * s); }
  function icon(c, s, k, x, y, col) { ICONS[k].forEach((row, j) => [...row].forEach((ch, i) => { if (ch === "G") px(c, s, x + i, y + j, col); })); }

    const c = cv.getContext("2d"); const s = cv.width / W;

    const pal = { ...FIX, B: ROLE[role].B, H: ROLE[role].H };
    const active = ["edit", "bash", "read", "test"].includes(st);
    const slow = Math.floor(fr / 3);
    const fi = ch.frames.length > 1 ? (active ? fr : slow) % ch.frames.length : 0;
    let bob = 0;
    if (!reduced) { if (ch.float) bob = slow % 2; else if (active) bob = fr % 2; }
    const ox = OX, oy = OY + bob;
    ch.frames[fi].forEach((row, y) => [...row].forEach((k, x) => { if (pal[k] && k !== ".") px(c, s, ox + x, oy + y, pal[k]); }));

    const eyeSet = ch.eyes[Math.min(fi, ch.eyes.length - 1)];
    let ec = ch.glow ? GLOW : FIX.K;
    if (ch.glow && (st === "ask" || st === "wait")) ec = AMBER;
    if (st === "blocked") ec = RED;
    const blink = !reduced && fr % 11 === 0;
    for (const [x, y] of eyeSet) {

        const lid = ch.pupilsOnWhite ? pal.B : null;

      } else {

        px(c, s, ox + x + look, oy + y, ec, ch.ew, ch.eh);

      const [lx, ly] = ch.armL, [rx, ry] = ch.armR, arm = pal.B;
      if (st === "wait") { px(c, s, ox + rx, oy + ry - 7, arm, 1, 8); px(c, s, ox + rx, oy + ry - 8, pal.H); px(c, s, ox + lx, oy + ly, arm, 1, 2); }
      else if ((st === "edit" || st === "test") && !reduced) { const u = fr % 2; px(c, s, ox + lx, oy + ly - u, arm, 1, 2); px(c, s, ox + rx, oy + ry - (1 - u), arm, 1, 2); }
      else if (st === "read") { px(c, s, ox + rx, oy + ry - 2, arm, 1, 3); px(c, s, ox + rx, oy + ry - 4, "#d8dbe6", 2, 2); px(c, s, ox + rx + 1, oy + ry - 2, "#d8dbe6"); }
      else { px(c, s, ox + lx, oy + ly, arm, 1, 2); px(c, s, ox + rx, oy + ry, arm, 1, 2); }
    } else if (st === "read") {
      px(c, s, ox + 13, oy + 8, "#d8dbe6", 2, 2); px(c, s, ox + 15, oy + 10, "#d8dbe6");
    }
    // desk + laptop
    if (desk) {
      const scr = st === "bash" ? (fr % 2 && !reduced ? GLOW : "#2f6f64") : active ? "#5d8fe0" : "#262c3c";
      px(c, s, 7, 15, FIX.K, 6, 3); px(c, s, 8, 15, scr, 4, 2);
      px(c, s, 0, 18, "#9c6c48", W, 1); px(c, s, 0, 19, "#7a5236", W, 2); px(c, s, 1, 21, "#3f2a1c", 2, 1); px(c, s, W - 3, 21, "#3f2a1c", 2, 1);
    }
    // overhead
    if (st === "wait") icon(c, s, "!", 15, 0, AMBER);
    if (st === "ask") icon(c, s, "?", 15, 0, AMBER);
    if (st === "idle") { icon(c, s, "z", 14, 2 - (reduced ? 0 : slow % 2), MUTED); }
    if (st === "done") { px(c, s, 16, 0, FIX.K, 1, 6); px(c, s, 17, 0, OKC, 3, 2); }
    if (st === "test") { px(c, s, 1, 0, FIX.K, 12, 2); px(c, s, 1, 0, OKC, 1 + (fr % 12), 2); }
    if (st === "bash" && ch.id === "botto" && !reduced && fr % 2) { px(c, s, ox + 7, oy + 2, RED, 2, 1); }
    if (st === "blocked" && !reduced) { [[1, 3], [16, 2], [15, 5], [2, 1], [17, 0]].forEach(([x, y], i) => { if ((fr + i) % 3) px(c, s, x, y + (fr % 2), "#9aa0b1", 2, 1); }); }
  }

  // ---- UI ----
  let picks = [];
  try { picks = JSON.parse(localStorage.getItem("tenbox-picks") || "[]"); } catch {}
  let cast = { master: "hoot", worker: "botto", reviewer: "pinch", sub: "boo" };
  try { cast = { ...cast, ...JSON.parse(localStorage.getItem("tenbox-cast") || "{}") }; } catch {}
  const save = () => { try { localStorage.setItem("tenbox-picks", JSON.stringify(picks)); localStorage.setItem("tenbox-cast", JSON.stringify(cast)); } catch {} };

  $("#states").innerHTML = STATES.map(([k, l]) => `<button type="button" data-st="${k}" class="${k === "wait" || k === "ask" ? "hum" : ""}" aria-pressed="${k === state}">${l}</button>`).join("");
  const big = [], small = [];
  $("#grid").innerHTML = CHARS.map((ch, i) => `
    <article class="card" data-card="${ch.id}">
      <div class="stage"><span class="num">${String(i + 1).padStart(2, "0")}</span>
        <canvas width="160" height="176" data-big="${ch.id}" aria-label="${ch.name}, a ${ch.tag}"></canvas>
        <div class="roles">${["master", "reviewer", "sub"].map(r => `<figure><canvas width="50" height="55" data-small="${ch.id}" data-role="${r}"></canvas><figcaption>${ROLE[r].label}</figcaption></figure>`).join("")}</div>
      </div>
      <div class="info">
        <div class="name">${ch.name} <small>${ch.tag}</small></div>
        <p class="desc">${ch.desc}</p>
        <span class="tic">${ch.tic}</span>
        <div class="row"><button class="btn" type="button" data-pick="${ch.id}">Pick</button></div>
      </div>
    </article>`).join("");

  function renderPicks() {
    document.querySelectorAll("[data-pick]").forEach(b => { const on = picks.includes(b.dataset.pick); b.classList.toggle("on", on); b.textContent = on ? "Picked ✓" : "Pick"; b.closest(".card").classList.toggle("picked", on); });
  }
  function renderCast() {
    $("#cast").innerHTML = Object.keys(ROLE).map(r => `<div class="slot"><b>${ROLE[r].label}</b><div class="stage"><canvas width="120" height="132" data-cast="${r}"></canvas></div><select id="cast-${r}" data-castsel="${r}" aria-label="${ROLE[r].label} character">${CHARS.map(ch => `<option value="${ch.id}"${cast[r] === ch.id ? " selected" : ""}>${ch.name} (${ch.tag})</option>`).join("")}</select></div>`).join("");
    renderSay();
  }
  function renderSay() {
    const nm = id => CHARS.find(c => c.id === id).name;
    const p = picks.length ? ` · favourites: ${picks.map(nm).join(", ")}` : "";
    $("#sayTxt").textContent = `Tenbox crew: master=${nm(cast.master)}, worker=${nm(cast.worker)}, reviewer=${nm(cast.reviewer)}, subagent=${nm(cast.sub)}${p}`;
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.st) { state = b.dataset.st; document.querySelectorAll("[data-st]").forEach(x => x.setAttribute("aria-pressed", x === b)); }
    if (b.dataset.pick) { const id = b.dataset.pick; picks = picks.includes(id) ? picks.filter(x => x !== id) : [...picks, id]; save(); renderPicks(); renderSay(); }
    if (b.id === "copy") {
      const t = $("#sayTxt").textContent;
      const done = ok => { $("#copyHint").textContent = ok ? "Copied. Paste it to Claude." : "Select the text and copy it."; };
      try { navigator.clipboard.writeText(t).then(() => done(true), () => { selectSay(); done(false); }); } catch { selectSay(); done(false); }
    }
  });
  function selectSay() { const r = document.createRange(); r.selectNodeContents($("#sayTxt")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  document.addEventListener("change", e => {
    if (e.target.id === "desk") desk = e.target.checked;
    if (e.target.dataset.castsel) { cast[e.target.dataset.castsel] = e.target.value; save(); renderSay(); }
  });

  renderPicks(); renderCast();
  const byId = id => CHARS.find(c => c.id === id);
  function tick() {
    f++;
    const st = state === "cycle" ? CYCLE[Math.floor(f / 8) % CYCLE.length] : state;
    $("#now").textContent = STATE_TEXT[st];
    document.querySelectorAll("canvas[data-big]").forEach(cv => draw(cv, byId(cv.dataset.big), "worker", st, f));
    document.querySelectorAll("canvas[data-small]").forEach(cv => draw(cv, byId(cv.dataset.small), cv.dataset.role, st, f + 1));
    document.querySelectorAll("canvas[data-cast]").forEach(cv => { const r = cv.dataset.cast; draw(cv, byId(cast[r]), r, st, f); });
  }
  tick();
  setInterval(tick, reduced ? 900 : 220);
})();
</script>
