name: image
# Builds a new machine image by hand (`gh workflow run image.yml`): a new server boots from
# the newest one. It no longer runs on every merge, since the box image (box.yml) is the path
# in use and every build costs a server hour and a snapshot.
on:
  workflow_dispatch:
# One build at a time; a second one waits, so the newest snapshot is the newest build.
concurrency:
  group: image
jobs:
  image:
    # Packer works on Hetzner, the runner only waits; MACHINE_RUNNER moves it as in machine.yml.
    runs-on: ${{ vars.MACHINE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-packer@v3
      - run: machines/packer/build.sh main
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
