name: machine
run-name: ${{ inputs.cmd }} ${{ inputs.task }}
# The control plane of the task machines (docs/design.md "Machines"): one tofu run per
# command, the state in the bucket. Only this workflow sees the machine secrets.
on:
  workflow_dispatch:
    inputs:
      task:
        description: The task id
        required: true
        type: string
      cmd:
        description: What to do with the task's machine
        required: true
        type: choice
        options: [start, build, close, down, destroy]
      project:
        description: "start only: the project name"
        type: string
      repo:
        description: "start only: the project's https clone URL"
        type: string
      title:
        description: "start only: the task title, for a project without a tracker"
        type: string
      force:
        description: "close only: close a task whose PR is not merged"
        type: boolean
        default: false
# One run per task at a time; a second one waits for the first.
concurrency:
  group: machine-${{ inputs.task }}
jobs:
  machine:
    # Hosted by default, a minute or two per run; the MACHINE_RUNNER variable moves it to a
    # self-hosted label when the hosted minutes are used up.
    runs-on: ${{ vars.MACHINE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: ${{ inputs.cmd }}
        run: |
          umask 077
          printf '%s\n' "$MACHINE_SSH_KEY" > "$MACHINE_SSH_KEY_FILE"
          if [ "$CMD" = close ]; then
            machines/machine.sh "$TASK" close ${FORCE:+--force}
          else
            machines/machine.sh "$TASK" "$CMD" "$PROJECT" "$REPO" "$TITLE"
          fi
        env:
          TASK: ${{ inputs.task }}
          CMD: ${{ inputs.cmd }}
          PROJECT: ${{ inputs.project }}
          REPO: ${{ inputs.repo }}
          TITLE: ${{ inputs.title }}
          FORCE: ${{ inputs.force && 'true' || '' }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TENBOX_BUCKET: ${{ vars.TENBOX_BUCKET }}
          TENBOX_BUCKET_LOCATION: ${{ vars.TENBOX_BUCKET_LOCATION }}
          BUCKET_ACCESS_KEY: ${{ secrets.BUCKET_ACCESS_KEY }}
          BUCKET_SECRET_KEY: ${{ secrets.BUCKET_SECRET_KEY }}
          MACHINE_GITHUB_TOKEN: ${{ secrets.MACHINE_GITHUB_TOKEN }}
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
          MACHINE_SSH_KEY: ${{ secrets.MACHINE_SSH_KEY }}
          MACHINE_SSH_KEY_FILE: ${{ runner.temp }}/machine-key
          NTFY_URL: ${{ secrets.NTFY_URL }}
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
