name: Feature
description: A new command, role or behaviour, or a change to one
labels: [feature]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What is missing or wrong today, and what it costs.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: What changes. Name the command, the role or the file.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we know it is done. A test, a command and its output, or a line in the reference.
    validations:
      required: true
